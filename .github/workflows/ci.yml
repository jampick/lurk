name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap and fast: fails the PR on a syntax error before spending three
  # runners on the full matrix.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    name: Unit (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  e2e:
    name: Smoke (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Electron needs a display server; GitHub's Linux runners are headless.
      - name: Run smoke tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Run smoke tests
        if: runner.os != 'Linux'
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7

  # Confirms the app actually packages. Catches a missing entry in build.files,
  # which no test can see because it only matters once the asar is assembled.
  package:
    name: Package check
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # fpm shells out to bsdtar to build the pacman package's .MTREE, and it is
      # not present on GitHub's Ubuntu image — without this the pacman target
      # fails with exit code 127.
      - name: Install pacman packaging prerequisites
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      # Builds the real Linux targets, not just --dir. AppImage/deb/pacman each
      # have their own tooling, and a target that only gets exercised at release
      # time is a target that breaks at release time.
      - name: Build Linux packages
        run: npx electron-builder --linux --publish never

      - name: Verify the packaged app contains what main.js requires
        run: node scripts/verify-package.mjs

      - name: Verify every configured Linux artifact was produced
        run: |
          cd dist
          ls -la
          for ext in AppImage deb pacman; do
            if ! ls *."$ext" >/dev/null 2>&1; then
              echo "::error::no .$ext artifact was produced"
              exit 1
            fi
          done
          # The AppImage is the only Linux format that can self-update, so its
          # update manifest has to exist or Omarchy/Arch users get nothing.
          test -f latest-linux.yml || { echo "::error::latest-linux.yml missing"; exit 1; }
          echo "All Linux artifacts and the update manifest are present."

  # Single required status check, so branch protection has one stable name to
  # point at no matter how the matrix above changes.
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, unit, e2e, package]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any upstream job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more CI jobs failed:"
          echo '${{ toJSON(needs) }}'
          exit 1
      - run: echo "All CI jobs passed."
