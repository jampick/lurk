name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Nothing gets built until the tagged commit passes the same bar as a PR,
  # and the tag matches what package.json claims to be.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # release notes diff against the previous tag
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check the tag matches package.json
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          # A hyphen means a prerelease (0.3.0-rc.1); mark it as such on GitHub
          # so electron-updater's stable channel does not offer it to everyone.
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the CHANGELOG has an entry for this version
        run: |
          if ! grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"
            exit 1
          fi

      - run: npm run lint
      - run: npm run test:unit
      - run: xvfb-run --auto-servernum npm run test:e2e

  build:
    name: Build (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # fpm needs bsdtar to build the pacman package's .MTREE and it is not on
      # GitHub's Ubuntu image. Without it the Linux build fails, which blocks
      # the publish job and leaves the release stuck as a draft.
      - name: Install pacman packaging prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      # Each matrix job uploads its artifacts into the same draft release.
      # The release stays a draft until the publish job below flips it, so a
      # half-built release is never visible to the auto-updater.
      - name: Build and upload installers
        shell: bash
        run: |
          # GitHub substitutes an empty string for an unconfigured secret rather
          # than omitting the variable, and an empty CSC_LINK is worse than an
          # absent one: electron-builder resolves it as a path and dies with
          # "not a file". Unset the empty ones so unsigned builds work.
          for var in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var}" ]; then unset "$var"; fi
          done
          npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing secrets are optional. When they are absent electron-builder
          # produces unsigned artifacts instead of failing — adding the secrets
          # later turns signing on with no workflow change. See #23.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Without this, macOS builds try to sign with whatever identity happens
          # to be in the runner keychain and fail confusingly.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}

  publish:
    name: Publish release
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate release notes
        run: node scripts/release-notes.mjs "${{ needs.verify.outputs.version }}" > notes.md

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            --latest="${{ needs.verify.outputs.prerelease == 'false' }}" \
            --prerelease="${{ needs.verify.outputs.prerelease }}" \
            --title "Lurk ${{ needs.verify.outputs.version }}" \
            --notes-file notes.md

      - name: Confirm the update manifests published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # electron-updater reads these; without them a published release is
          # invisible to every installed copy of the app.
          ASSETS="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          echo "$ASSETS"
          for manifest in latest.yml latest-linux.yml latest-mac.yml; do
            if ! echo "$ASSETS" | grep -qx "$manifest"; then
              echo "::warning::$manifest is missing — clients on that platform will not see this release"
            fi
          done
