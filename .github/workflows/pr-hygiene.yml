name: PR hygiene

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  issue-link:
    name: Linked issue
    runs-on: ubuntu-latest
    steps:
      - name: Require a linked issue
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # Every change is supposed to be traceable to an issue. `no-issue` is
          # the deliberate exception — use it for typo fixes and the like.
          if [[ ",$LABELS," == *",no-issue,"* ]]; then
            echo "Labelled no-issue — skipping."
            exit 0
          fi

          if echo "$TITLE $BODY" | grep -qiE '(#[0-9]+|(closes|fixes|resolves|refs|part of)[[:space:]]+#[0-9]+)'; then
            echo "Found an issue reference."
            exit 0
          fi

          echo "::error::This PR references no issue."
          echo ""
          echo "Add one to the description, e.g. 'Closes #12'."
          echo "If this genuinely does not need an issue, add the 'no-issue' label."
          exit 1

  title:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # PR titles become squash-commit subjects, which is what the release
          # notes are generated from — so the format is enforced here.
          PATTERN='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9,/-]+\))?!?: .{3,}'
          if echo "$TITLE" | grep -qE "$PATTERN"; then
            echo "OK: $TITLE"
            exit 0
          fi
          echo "::error::PR title must follow Conventional Commits."
          echo ""
          echo "  Got:      $TITLE"
          echo "  Expected: <type>(<optional scope>): <description>"
          echo "  Types:    feat, fix, perf, refactor, docs, test, build, ci, chore, revert"
          echo ""
          echo "  Examples: feat(updates): notify when a new version is available"
          echo "            fix(comments): stop the live poll leaking a timer"
          exit 1

  changelog:
    name: Changelog entry
    runs-on: ubuntu-latest
    steps:
      - name: Require a CHANGELOG entry for user-facing changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ github.event.pull_request.title }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # `npm run release` refuses to cut a version whose [Unreleased]
          # section is empty, which is the right guard at the wrong moment:
          # #41 merged without an entry and the gap only surfaced when v0.3.3
          # had to ship as a hotfix (#44). Catch it here instead, while the
          # author still remembers what the change does.
          #
          # Only the user-facing types are held to this. ci/docs/chore and the
          # rest skip it, and `no-changelog` is the escape hatch for a fix
          # nobody outside the repo would notice.
          if [[ ",$LABELS," == *",no-changelog,"* ]]; then
            echo "Labelled no-changelog, skipping."
            exit 0
          fi

          if ! echo "$TITLE" | grep -qE '^(feat|fix|perf)(\([a-z0-9,/-]+\))?!?: '; then
            echo "Not a feat/fix/perf PR, no entry needed."
            exit 0
          fi

          FILES="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')"
          if echo "$FILES" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md is in the diff."
            exit 0
          fi

          echo "::error::This PR changes something users will notice but does not touch CHANGELOG.md."
          echo ""
          echo "Add a line under '## [Unreleased]' saying what changed and why, in the"
          echo "same voice as the entries already there. The release notes are built"
          echo "from that section, and the release script refuses to run on an empty one."
          echo "If this change is invisible to users, add the 'no-changelog' label."
          exit 1
